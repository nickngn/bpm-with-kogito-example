spring.application.name=account-opening-ui
server.port=8090

# kogito-springboot-app's REST API (see AccountOpeningResource / UserTasksResource there).
kogito.api.base-url=http://localhost:8080

# Keycloak - same realm/users as the Task Console (kogito-springboot-app/keycloak/kogito-realm.json).
# ADFS federation is scaffolded there as a disabled identity provider; once enabled, users
# can log in via ADFS and Keycloak still issues this app the same OIDC tokens below.
spring.security.oauth2.client.registration.keycloak.client-id=account-opening-ui
spring.security.oauth2.client.registration.keycloak.client-secret=account-opening-ui-secret
spring.security.oauth2.client.registration.keycloak.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.keycloak.scope=openid,profile
spring.security.oauth2.client.provider.keycloak.issuer-uri=http://localhost:8081/realms/kogito
