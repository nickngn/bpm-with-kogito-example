<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!--
  bpmn-js process diagram. Two fragments:
    assets  - stylesheets + markers, goes in <head>
    diagram - the canvas itself, takes the process instance id
-->
<body>

<th:block th:fragment="assets">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bpmn-js@18.28.0/dist/assets/diagram-js.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bpmn-js@18.28.0/dist/assets/bpmn-js.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bpmn-js@18.28.0/dist/assets/bpmn-font/css/bpmn.css"/>
    <style>
        .bpmn-wrap { margin-top: 2rem; }
        .bpmn-canvas {
            height: 520px;
            border: 1px solid #ddd;
            border-radius: 4px;
            background: #fff;
        }
        .bpmn-legend { margin-bottom: 0.5rem; font-size: 0.85rem; color: #555; }
        .bpmn-legend span { margin-right: 1rem; }
        .bpmn-legend i {
            display: inline-block;
            width: 0.75rem;
            height: 0.75rem;
            margin-right: 0.3rem;
            border: 2px solid;
            vertical-align: middle;
        }
        .bpmn-legend .k-done   { border-color: #8a8a8a; background: #eee; }
        .bpmn-legend .k-active { border-color: #1565c0; background: #e3f2fd; }
        .bpmn-legend .k-mine   { border-color: #ef6c00; background: #fff3e0; }

        /* bpmn-js draws the element shape as the first child of .djs-visual. */
        .djs-element.node-done   .djs-visual > :nth-child(1) {
            stroke: #8a8a8a !important; fill: #eeeeee !important;
        }
        .djs-element.node-active .djs-visual > :nth-child(1) {
            stroke: #1565c0 !important; stroke-width: 3px !important; fill: #e3f2fd !important;
        }
        .djs-element.node-mine   .djs-visual > :nth-child(1) {
            stroke: #ef6c00 !important; stroke-width: 3px !important; fill: #fff3e0 !important;
        }
        .djs-element.node-clickable { cursor: pointer; }

        .bpmn-badge {
            font-family: sans-serif;
            font-size: 11px;
            line-height: 1.3;
            white-space: nowrap;
            padding: 2px 6px;
            border-radius: 3px;
            border: 1px solid #1565c0;
            background: #e3f2fd;
            color: #0d47a1;
        }
        .bpmn-badge.is-mine { border-color: #ef6c00; background: #fff3e0; color: #e65100; }
        .bpmn-badge b { font-weight: 600; }
    </style>
</th:block>

<div th:fragment="diagram(processInstanceId)" class="bpmn-wrap">
    <div class="bpmn-legend">
        <span><i class="k-done"></i>Done</span>
        <span><i class="k-active"></i>In progress</span>
        <span><i class="k-mine"></i>Waiting on you</span>
    </div>
    <div class="bpmn-canvas" id="bpmn-canvas" th:attr="data-process-instance-id=${processInstanceId}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bpmn-js@18.28.0/dist/bpmn-navigated-viewer.production.min.js"></script>
    <script src="/js/process-diagram.js"></script>
</div>

</body>
</html>
