<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Account Opening - Task</title>
    <style>
        body { font-family: sans-serif; margin: 2rem; }
        label { display: block; margin-top: 1rem; font-weight: bold; }
    </style>
    <th:block th:insert="~{fragments/diagram :: assets}"></th:block>
</head>
<body>
<p><a href="/tasks">&larr; Back to My Tasks</a></p>
<h1 th:text="${task.taskName}"></h1>
<p>Status: <span th:text="${task.status.name}"></span> &middot; Owner: <span th:text="${task.actualOwner}"></span></p>

<form th:action="@{'/tasks/' + ${task.id} + '/complete'}" method="post" th:if="${task.status.name == 'Reserved'}">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
    <div th:each="entry : ${outputFields}">
        <label th:for="${'field_' + entry.key}" th:text="${entry.key}"></label>
        <select th:if="${entry.value}" th:name="${'field_' + entry.key}" th:id="${'field_' + entry.key}">
            <option value="false">No</option>
            <option value="true">Yes</option>
        </select>
        <input th:unless="${entry.value}" type="text" th:name="${'field_' + entry.key}" th:id="${'field_' + entry.key}"/>
    </div>
    <button type="submit" style="margin-top: 1rem;">Complete</button>
</form>
<p th:unless="${task.status.name == 'Reserved'}">Claim this task from the inbox before completing it.</p>

<h2>Where this is in the process</h2>
<div th:replace="~{fragments/diagram :: diagram(${task.processInfo.processInstanceId})}"></div>
</body>
</html>
