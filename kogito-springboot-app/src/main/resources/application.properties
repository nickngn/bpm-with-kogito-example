server.address=0.0.0.0

kogito.service.url=http://localhost:8080

# Embedded Data Index (serves GraphQL at /graphql, queried by the Management and Task
# Consoles) backed by a file-based H2 database so instances survive app restarts.
kogito.persistence.type=jdbc
kie.flyway.enabled=true
spring.flyway.enabled=false
spring.datasource.url=jdbc:h2:file:./target/data/dataindex;NON_KEYWORDS=VALUE,KEY
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database=H2
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
spring.graphql.graphiql.enabled=true